<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký</title>
    <link rel="stylesheet" href="Sign up.css">
</head>
<body>

<div class="auth-container">
    <!-- Nút chuyển đổi Đăng nhập / Đăng ký -->
    <div class="auth-toggle">
        <button id="login-tab" class="active">Đăng Nhập</button>
        <button id="register-tab">Đăng Ký</button>
    </div>
<!-- Chỉnh sửa UI tra cứu -->
    <!-- Form Đăng nhập -->
    <form id="login-form" class="auth-form">
        <h2>Chào mừng trở lại!</h2>
        <div class="input-group">
            <label for="login-username">Tài khoản hoặc Email</label>
            <input type="text" id="login-username" name="username" placeholder="Nhập tên tài khoản hoặc email..." required>
        </div>
        <div class="input-group">
            <label for="login-password">Mật khẩu</label>
            <input type="password" id="login-password" name="password" placeholder="Nhập mật khẩu..." required>
        </div>
        <button type="submit" class="btn-primary">Đăng Nhập</button>
    </form>

    <!-- Form Đăng ký -->
    <form id="register-form" class="auth-form" style="display: none;">
        <h2>Tạo tài khoản mới</h2>
        <div class="input-group">
            <label for="reg-fullname">Tài khoản</label>
            <input type="text" id="reg-fullname" name="username" placeholder="Tên tài khoản..." required>
        </div>
        <div class="input-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" placeholder="Email của bạn..." required>
        </div>
        <div class="input-group">
            <label for="reg-password">Mật khẩu</label>
            <input type="password" id="reg-password" name="password" placeholder="Mật khẩu..." required>
        </div>
        <button type="submit" class="btn-primary">Đăng Ký</button>
    </form>
</div>

<script src="Sign up.js"></script>

</body>
</html>
